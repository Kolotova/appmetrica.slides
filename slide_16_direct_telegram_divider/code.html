<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bento-grid-bg {
            background-image: radial-gradient(circle at 2px 2px, #303849 1px, transparent 0);
            background-size: 40px 40px;
        }
    </style>
<style id="telegram-cleanup-style">
body{background:#11131a!important;color:#e1e2eb!important;font-family:Inter,Arial,sans-serif!important}
header,body>nav,footer{display:none!important}
main{padding-top:64px!important}
.deck-eyebrow{display:inline-flex!important;align-items:center!important;width:max-content!important;padding:4px 16px!important;border-radius:9999px!important;background:rgba(83,141,253,.10)!important;border:1px solid rgba(83,141,253,.20)!important;color:#afc6ff!important;font-family:Inter,sans-serif!important;font-size:14px!important;line-height:20px!important;font-weight:500!important;letter-spacing:0!important;text-transform:none!important;margin-bottom:16px!important}

.no-ai-garbage{display:none!important}

<body class="bg-surface text-on-surface font-body-md min-h-screen overflow-x-hidden">
<!-- TopNavBar -->
<main class="min-h-[calc(100vh-80px)] flex items-center justify-center relative overflow-hidden bento-grid-bg">
<!-- Background Glow Effects -->
<div class="absolute top-[-10%] right-[-10%] w-[600px] h-[600px] bg-primary/10 blur-[120px] rounded-full pointer-events-none"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-tertiary-container/10 blur-[100px] rounded-full pointer-events-none"></div>
<div class="max-w-container-max w-full px-margin-desktop grid grid-cols-12 gap-gutter items-center">
<!-- Left Side: Content -->
<div class="col-span-12 lg:col-span-7 flex flex-col gap-stack-lg z-10">

<h1 class="font-display-xl text-display-xl text-on-surface">
                    Рост Telegram adoption <br/>
<span class="text-primary">в Директе</span>
</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xl">
                    Увеличить долю пользователей, указавших Telegram для уведомлений, с 10% до 30% без платного продвижения и продуктовых доработок.
                </p>
<div class="mt-stack-md flex items-center gap-stack-sm text-on-surface-variant italic">
<span class="material-symbols-outlined text-[18px]" data-icon="lightbulb">lightbulb</span>
<span class="font-label-md text-label-md">Только маркетинговые инструменты</span>
</div>
</div>
<!-- Right Side: Large Data Card -->
<div class="col-span-12 lg:col-span-5 z-10">
<div class="bg-surface-container-low border border-outline-variant p-stack-xl rounded-[32px] relative overflow-hidden group">
<!-- Subtle Glass Highlight -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-tertiary opacity-50"></div>
<div class="flex flex-col items-center text-center gap-stack-lg">
<div class="flex flex-col gap-stack-sm">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Целевой показатель</span>
<div class="font-display-xl text-[120px] leading-none font-black text-on-surface transition-transform group-hover:scale-105 duration-500">
                                10% <span class="text-primary text-[64px] font-light">-&gt;</span> 30%
                            </div>
</div>
<div class="flex flex-wrap justify-center gap-stack-sm mt-stack-md">
<div class="px-stack-md py-stack-sm bg-primary/10 border border-primary/20 rounded-full text-primary font-label-md text-label-md backdrop-blur-sm">
                                awareness
                            </div>
<div class="px-stack-md py-stack-sm bg-tertiary/10 border border-tertiary/20 rounded-full text-tertiary font-label-md text-label-md backdrop-blur-sm">
                                value
                            </div>
<div class="px-stack-md py-stack-sm bg-secondary/10 border border-secondary/20 rounded-full text-secondary font-label-md text-label-md backdrop-blur-sm">
                                owned channels
                            </div>
</div>
</div>
<!-- Abstract Background Pattern -->
<div class="absolute bottom-[-20%] right-[-10%] opacity-10 pointer-events-none transition-transform group-hover:rotate-12 duration-1000">
<span class="material-symbols-outlined text-[240px]" data-icon="send" style="font-variation-settings: 'FILL' 1;">send</span>
</div>
</div>
</div>
</div>
</main>
<!-- Footer -->
<script>
        // Micro-interactions for hover effects
        document.querySelectorAll('.group').forEach(item => {
            item.addEventListener('mousemove', (e) => {
                const rect = item.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                item.style.setProperty('--mouse-x', `${x}px`);
                item.style.setProperty('--mouse-y', `${y}px`);
            });
        });
    </script>
